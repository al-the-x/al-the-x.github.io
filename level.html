permalink: /level
---

<h2 class="summary">Spirit level</h2>

<div id="level-app"></div>

<script src="https://unpkg.com/fulltilt@0.7.1/dist/fulltilt.min.js"></script>
<script src="https://unpkg.com/p5@1.11.7/lib/p5.min.js"></script>
<script type="module">
  import { h, render } from 'https://unpkg.com/preact@10.26.9/dist/preact.module.js';
  import { useEffect, useMemo, useRef, useState } from 'https://unpkg.com/preact@10.26.9/hooks/dist/hooks.module.js';

  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

  const canRequestMotionPermission =
    typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';

  function LevelApp() {
    const canvasContainerRef = useRef(null);
    const sketchRef = useRef(null);
    const orientationRef = useRef({ roll: 0, pitch: 0 });
    const orientationControllerRef = useRef(null);
    const intervalRef = useRef(null);

    const [roll, setRoll] = useState(0);
    const [pitch, setPitch] = useState(0);
    const [started, setStarted] = useState(false);
    const [status, setStatus] = useState('Ready.');
    const [orientationLocked, setOrientationLocked] = useState(false);

    const lockButtonLabel = useMemo(
      () => (orientationLocked ? 'Unlock orientation' : 'Lock orientation'),
      [orientationLocked]
    );

    useEffect(() => {
      const sketch = new p5((p) => {
        const getSize = () => Math.min(window.innerWidth * 0.8, 420);

        const drawLevel = () => {
          const width = p.width;
          const height = p.height;
          const centerX = width / 2;
          const centerY = height / 2;
          const outerRadius = Math.min(width, height) / 2 - 16;
          const moveRadius = outerRadius * 0.78;
          const x = centerX + (clamp(orientationRef.current.roll, -45, 45) / 45) * moveRadius;
          const y = centerY + (clamp(orientationRef.current.pitch, -45, 45) / 45) * moveRadius;

          p.background('#0f172a');

          p.stroke('#334155');
          p.strokeWeight(3);
          p.noFill();
          p.circle(centerX, centerY, outerRadius * 2);

          p.stroke('#475569');
          p.strokeWeight(1);
          p.line(centerX - outerRadius, centerY, centerX + outerRadius, centerY);
          p.line(centerX, centerY - outerRadius, centerX, centerY + outerRadius);

          p.noStroke();
          p.fill('#22c55e');
          p.circle(x, y, outerRadius * 0.26);

          p.fill('#e2e8f0');
          p.textAlign(p.CENTER, p.CENTER);
          p.textSize(16);
          p.text(`roll: ${orientationRef.current.roll.toFixed(1)}°`, centerX, height - 34);
          p.text(`pitch: ${orientationRef.current.pitch.toFixed(1)}°`, centerX, height - 14);
        };

        p.setup = () => {
          p.createCanvas(getSize(), getSize()).parent(canvasContainerRef.current);
        };

        p.windowResized = () => {
          p.resizeCanvas(getSize(), getSize());
        };

        p.draw = () => {
          drawLevel();
        };
      });

      sketchRef.current = sketch;

      return () => {
        if (intervalRef.current) {
          clearInterval(intervalRef.current);
        }

        if (orientationControllerRef.current && typeof orientationControllerRef.current.stop === 'function') {
          orientationControllerRef.current.stop();
        }

        sketch.remove();
      };
    }, []);

    const startOrientation = () => {
      if (started) {
        return;
      }

      if (typeof FULLTILT === 'undefined' || !FULLTILT.DeviceOrientation) {
        setStatus('Orientation library did not load.');
        return;
      }

      setStarted(true);
      setStatus('Starting orientation sensor...');

      const orientationController = new FULLTILT.DeviceOrientation({ type: 'game' });
      orientationControllerRef.current = orientationController;

      orientationController.start(
        () => {
          setStatus('Move your phone to use the level.');

          intervalRef.current = window.setInterval(() => {
            const euler = orientationController.getScreenAdjustedEuler();

            if (!euler) {
              return;
            }

            const nextPitch = euler.beta || 0;
            const nextRoll = euler.gamma || 0;

            orientationRef.current = { roll: nextRoll, pitch: nextPitch };
            setRoll(nextRoll);
            setPitch(nextPitch);
          }, 50);
        },
        () => {
          setStatus('Orientation API is unavailable on this device/browser.');
          setStarted(false);
        }
      );
    };

    const onEnableMotion = async () => {
      if (canRequestMotionPermission) {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();

          if (permission !== 'granted') {
            setStatus('Motion permission denied.');
            return;
          }
        } catch (error) {
          setStatus('Could not request motion permission.');
          return;
        }
      }

      startOrientation();
    };

    const onToggleFullscreen = async () => {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen?.();
        return;
      }

      await document.exitFullscreen?.();
    };

    const onToggleOrientationLock = async () => {
      if (!screen.orientation?.lock) {
        setStatus('Orientation lock is not supported in this browser.');
        return;
      }

      if (!orientationLocked) {
        try {
          await screen.orientation.lock('portrait-primary');
          setOrientationLocked(true);
        } catch (error) {
          setStatus('Could not lock orientation (fullscreen may be required).');
        }

        return;
      }

      screen.orientation.unlock?.();
      setOrientationLocked(false);
    };

    return h('div', null,
      h('p', { id: 'level-status' }, status),
      h('div', {
        ref: canvasContainerRef,
        style: 'display:block;margin:1rem auto;max-width:100%;width:max-content;background:#111;border-radius:12px;overflow:hidden;'
      }),
      h('p', {
        style: 'display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;'
      },
        h('button', { type: 'button', onClick: onEnableMotion }, started ? 'Motion enabled' : 'Enable motion'),
        h('button', { type: 'button', onClick: onToggleFullscreen }, 'Fullscreen'),
        h('button', { type: 'button', onClick: onToggleOrientationLock }, lockButtonLabel)
      ),
      h('p', { style: 'text-align:center;margin-top:.5rem;' }, `roll ${roll.toFixed(1)}°, pitch ${pitch.toFixed(1)}°`)
    );
  }

  render(h(LevelApp), document.getElementById('level-app'));
</script>
