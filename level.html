---
permalink: /level
---

<h2 class="summary">Spirit level</h2>

<div id="level-app"></div>

<script src="https://unpkg.com/p5@1.11.7/lib/p5.min.js"></script>
<script type="module">
  import {
    html,
    render,
    useEffect,
    useRef,
    useState
  } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js';

  const STATES = {
    Loading: 'loading',
    Starting: 'starting',
    Running: 'running',
    Locked: 'locked',
    Failed: 'failed'
  };

  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const canRequestMotionPermission =
    typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function';

  async function loadFullTilt() {
    await import('https://unpkg.com/fulltilt@0.7.1/dist/fulltilt.min.js');

    if (!window.FULLTILT || !window.FULLTILT.DeviceOrientation) {
      throw new Error('Orientation library did not load.');
    }

    return window.FULLTILT.DeviceOrientation;
  }

  function LevelApp({ DeviceOrientation }) {
    const canvasContainerRef = useRef(null);
    const orientationRef = useRef({ roll: 0, pitch: 0 });
    const orientationControllerRef = useRef(null);

    const [roll, setRoll] = useState(0);
    const [pitch, setPitch] = useState(0);
    const [appState, setAppState] = useState(STATES.Loading);
    const [errorMessage, setErrorMessage] = useState('');
    const [isFullscreen, setIsFullscreen] = useState(Boolean(document.fullscreenElement));

    const stopOrientation = () => {
      orientationControllerRef.current?.stop?.();
      orientationControllerRef.current = null;
    };

    useEffect(() => {
      const sketch = new p5((p) => {
        const getSize = () => Math.min(window.innerWidth * 0.8, 420);

        p.setup = () => {
          p.createCanvas(getSize(), getSize()).parent(canvasContainerRef.current);
        };

        p.windowResized = () => {
          p.resizeCanvas(getSize(), getSize());
        };

        p.draw = () => {
          const width = p.width;
          const height = p.height;
          const centerX = width / 2;
          const centerY = height / 2;
          const outerRadius = Math.min(width, height) / 2 - 16;
          const moveRadius = outerRadius * 0.78;
          const x = centerX + (clamp(orientationRef.current.roll, -45, 45) / 45) * moveRadius;
          const y = centerY + (clamp(orientationRef.current.pitch, -45, 45) / 45) * moveRadius;

          p.background('#0f172a');

          p.stroke('#334155');
          p.strokeWeight(3);
          p.noFill();
          p.circle(centerX, centerY, outerRadius * 2);

          p.stroke('#475569');
          p.strokeWeight(1);
          p.line(centerX - outerRadius, centerY, centerX + outerRadius, centerY);
          p.line(centerX, centerY - outerRadius, centerX, centerY + outerRadius);

          p.noStroke();
          p.fill('#22c55e');
          p.circle(x, y, outerRadius * 0.26);

          p.fill('#e2e8f0');
          p.textAlign(p.CENTER, p.CENTER);
          p.textSize(16);
          p.text(`roll: ${orientationRef.current.roll.toFixed(1)}°`, centerX, height - 34);
          p.text(`pitch: ${orientationRef.current.pitch.toFixed(1)}°`, centerX, height - 14);
        };
      });

      const onFullscreenChange = () => {
        setIsFullscreen(Boolean(document.fullscreenElement));
      };

      document.addEventListener('fullscreenchange', onFullscreenChange);

      return () => {
        document.removeEventListener('fullscreenchange', onFullscreenChange);
        stopOrientation();
        sketch.remove();
      };
    }, []);

    const updateFailedState = (message) => {
      setErrorMessage(message);
      setAppState(STATES.Failed);
    };

    const startOrientation = () => {
      stopOrientation();
      setErrorMessage('');
      setAppState(STATES.Starting);

      const controller = new DeviceOrientation({ type: 'game' });
      orientationControllerRef.current = controller;

      controller.start(
        () => {
          controller.listen(() => {
            const euler = controller.getScreenAdjustedEuler();

            if (!euler) {
              return;
            }

            const nextPitch = euler.beta || 0;
            const nextRoll = euler.gamma || 0;

            orientationRef.current = { roll: nextRoll, pitch: nextPitch };
            setRoll(nextRoll);
            setPitch(nextPitch);
          });

          setAppState(STATES.Running);
        },
        () => {
          stopOrientation();
          updateFailedState('Orientation API is unavailable on this device/browser.');
        }
      );
    };

    const onEnableMotion = async () => {
      if (canRequestMotionPermission) {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();

          if (permission !== 'granted') {
            updateFailedState('Motion permission denied.');
            return;
          }
        } catch (error) {
          updateFailedState('Could not request motion permission.');
          return;
        }
      }

      startOrientation();
    };

    const onToggleFullscreen = async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen?.();
          return;
        }

        await document.exitFullscreen?.();
      } catch (error) {
        updateFailedState('Could not change fullscreen mode.');
      }
    };

    const onToggleOrientationLock = async () => {
      if (!screen.orientation?.lock) {
        updateFailedState('Orientation lock is not supported in this browser.');
        return;
      }

      if (appState !== STATES.Locked) {
        try {
          await screen.orientation.lock('portrait-primary');
          setErrorMessage('');
          setAppState(STATES.Locked);
        } catch (error) {
          updateFailedState('Could not lock orientation (fullscreen may be required).');
        }

        return;
      }

      screen.orientation.unlock?.();
      setErrorMessage('');
      setAppState(STATES.Running);
    };

    const statusText = {
      [STATES.Loading]: 'Ready.',
      [STATES.Starting]: 'Starting orientation sensor...',
      [STATES.Running]: 'Move your phone to use the level.',
      [STATES.Locked]: 'Orientation locked.',
      [STATES.Failed]: errorMessage || 'An error occurred.'
    }[appState];

    return html`
      <div>
        <p id="level-status">${statusText}</p>
        <div
          ref=${canvasContainerRef}
          style="display:block;margin:1rem auto;max-width:100%;width:max-content;background:#111;border-radius:12px;overflow:hidden;"
        ></div>
        <p style="display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap;">
          <button type="button" onClick=${onEnableMotion}>
            ${appState === STATES.Starting ? 'Starting…' : 'Enable motion'}
          </button>
          <button type="button" onClick=${onToggleFullscreen}>
            ${isFullscreen ? 'Exit fullscreen' : 'Fullscreen'}
          </button>
          <button
            type="button"
            onClick=${onToggleOrientationLock}
            disabled=${appState !== STATES.Running && appState !== STATES.Locked}
          >
            ${appState === STATES.Locked ? 'Unlock orientation' : 'Lock orientation'}
          </button>
        </p>
        <p style="text-align:center;margin-top:.5rem;">
          roll ${roll.toFixed(1)}°, pitch ${pitch.toFixed(1)}°
        </p>
      </div>
    `;
  }

  const appRoot = document.getElementById('level-app');

  try {
    const DeviceOrientation = await loadFullTilt();
    render(html`<${LevelApp} DeviceOrientation=${DeviceOrientation} />`, appRoot);
  } catch (error) {
    render(html`<p id="level-status">${error?.message || 'Failed to load orientation library.'}</p>`, appRoot);
  }
</script>
